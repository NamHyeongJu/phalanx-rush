<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1e35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>방진 돌격대</title>
<link rel="icon" href="assets/ui/equipment-helmet.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="profile">
      <div class="avatar"><img src="assets/ui/equipment-helmet.png" alt=""></div>
      <div class="pinfo"><span class="pname">방진 사령관</span>
        <span class="power"><img src="assets/ui/combat-power-small.png" alt=""><b id="power">0</b></span></div>
    </div>
    <div class="cur" id="goldPill"><img src="assets/ui/currency-gold.png" alt="골드"><span id="gold">0</span></div>
    <div class="cur gem"><img src="assets/ui/currency-gem.png" alt="보석"><span id="gems">0</span></div>
    <button id="btnMenu" class="roundbtn" aria-label="설정">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 6h16v2.5H4zm0 5h16v2.5H4zm0 5h16v2.5H4z"/></svg>
    </button>
  </header>

  <section id="battle">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div id="questBox">
        <div class="qhead"><span id="questNo">퀘스트 1</span><span class="qrew"><img src="assets/ui/currency-gem.png" alt=""><b id="questReward">30</b></span></div>
        <div id="questText">-</div>
        <div class="qbar"><i></i><span id="questProg">0/0</span></div>
      </div>
      <div id="stageBox"><div id="stageName">1-1</div><div id="wavePips"></div>
        <button id="btnChallenge" hidden>보스 도전!</button></div>
      <div id="hudRight">
        <button id="btnSpeed" class="hudbtn">x1</button>
        <button id="btnSound" class="hudbtn" aria-label="효과음">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3z"/><path class="w" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/><path class="x" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M15 9l6 6M21 9l-6 6"/></svg>
        </button>
      </div>
      <div id="bossBar" hidden><div class="btop"><span class="bname"></span><span class="bhp"></span></div><div class="bbar"><i></i></div></div>
      <div id="armyBox"><img src="assets/weapons/roman-shield.png" alt=""><span>병력</span><b id="armyCount">0/48</b></div>
    </div>
    <div id="toasts"></div>
  </section>

  <section id="actionbar">
    <div id="skillSlots"></div>
    <button id="btnAuto" aria-label="스킬 자동"><img src="assets/ui/skill-auto-on.png" alt=""></button>
    <button id="btnSummon">
      <img class="contract" src="assets/ui/mercenary-contract.png" alt="">
      <span class="stext"><b id="summonLabel">병사 뽑기</b><span class="scost"><img src="assets/ui/currency-gold.png" alt=""><span id="summonCost">0</span></span></span>
      <em id="emptyBadge">0</em>
      <span id="tutHand" hidden><img src="assets/ui/tutorial-hand.png" alt=""><span class="bubble">병사가 쓰러지면<br>뽑기로 보충!</span></span>
    </button>
  </section>

  <main id="panel">
    <div class="tab" id="tab-upgrade"></div>
    <div class="tab" id="tab-army" hidden></div>
    <div class="tab" id="tab-skill" hidden></div>
    <div class="tab" id="tab-summon" hidden></div>
  </main>

  <nav id="nav">
    <button data-tab="upgrade"><img src="assets/ui/menu-growth.png" alt=""><span>강화</span></button>
    <button data-tab="army"><img src="assets/ui/menu-guild.png" alt=""><span>부대</span></button>
    <button data-tab="skill"><img src="assets/ui/menu-growth-hood.png" alt=""><span>스킬</span></button>
    <button data-tab="summon"><img src="assets/ui/forge-crystal.png" alt=""><span>소환</span></button>
  </nav>

  <div id="modal" hidden></div>

  <div id="loading">
    <img class="lhelm" src="assets/ui/equipment-helmet.png" alt="">
    <h1>방진 돌격대</h1>
    <p>오크 대군을 향해 돌격하라!</p>
    <div class="lbar"><i></i></div>
  </div>
</div>

<script src="js/manifest.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
